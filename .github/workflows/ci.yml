name: LangGraph Energy Agent CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Tests and image build only: do not deploy or expose API credentials in Actions.
permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Unit and regression tests (mocked LLM)
        run: python -m pytest -q
      - name: Validate the 26-case evaluation dataset (no LLM calls)
        run: python evaluation/run_eval.py --dry-run
      - name: Check tracked files for sensitive artifacts
        run: python scripts/check_tracked_files.py

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build container image (no secrets passed; do not push)
        run: docker build --tag langgraph-energy-agent:ci .
