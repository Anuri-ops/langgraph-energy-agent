# Local demo: private, loopback-bound FastAPI. Do not publish port 8000 to 0.0.0.0.
services:
  api:
    build:
      context: .
    env_file:
      - .env
    environment:
      AGENT_TRACE_DIR: /app/traces
      AUTO_INGEST_ON_START: "0"  # Explicit one-time ingestion below controls API cost.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - chroma_data:/app/chroma_db
      - traces_data:/app/traces
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
  ingest:
    build:
      context: .
    profiles: ["setup"]
    env_file:
      - .env
    volumes:
      - chroma_data:/app/chroma_db
    entrypoint: ["python", "ingest.py"]

volumes:
  chroma_data:
  traces_data:
